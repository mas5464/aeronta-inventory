# Trax IO Review — local full-stack test deployment (Planner UI + BFF).
# Scoped to this project only. Does NOT touch any other containers.
#   docker compose up --build         # build + run
#   open http://localhost:8088         # the Planner UI (8080 is eMRO)
#   docker compose down                # stop + remove
name: trax-io-planner

services:
  bff:
    build:
      context: .
      dockerfile: deploy/bff.Dockerfile
    container_name: trax-io-bff
    ports:
      - "8001:8000" # direct API access for poking/debugging (optional; host 8000 was taken)
    healthcheck:
      test:
        [
          "CMD",
          "uv",
          "run",
          "--no-sync",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/tenants/acme/killswitch')",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  ui:
    build:
      context: ./apps/planner-ui
    container_name: trax-io-planner-ui
    ports:
      - "8088:80" # host 8080 is taken by the eMRO system
    depends_on:
      bff:
        condition: service_healthy
