# Trax IO Review — local full-stack test deployment (Planner UI + BFF).
# Scoped to this project only. Does NOT touch any other containers.
#   docker compose up --build         # build + run
#   open http://localhost:8088         # the Planner UI (8080 is eMRO)
#   docker compose down                # stop + remove
name: trax-io-planner

services:
  bff:
    build:
      context: .
      dockerfile: deploy/bff.Dockerfile
    container_name: trax-io-bff
    # Boot from a COMPLETE precomputed snapshot (trax-io-precompute --out): the built
    # (pooled) feature store + keys + manifest + recs load via from_snapshot_dir — no
    # extract parsing, no pooling, no engine at boot. Real FULL-NETWORK eMRO data
    # (58.9K planning-active keys), gitignored, mounted read-only. To revert to the
    # slower paths: unset PLANNER_SNAPSHOT_DIR and restore EXTRACT_DIR (+ optional
    # PLANNER_RECS_FILE) — see bff/asgi.py.
    volumes:
      - ./deploy/_local_extract/emro_net_full_snapshot:/data/snapshot:ro
    environment:
      - PLANNER_SNAPSHOT_DIR=/data/snapshot
      - PLANNER_TENANT=acme
    ports:
      - "8001:8000" # direct API access for poking/debugging (optional; host 8000 was taken)
    healthcheck:
      test:
        [
          "CMD",
          "uv",
          "run",
          "--no-sync",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/tenants/acme/killswitch')",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s # from_snapshot_dir loads the precomputed feature store — measured ~7s boot (was ~190s)

  ui:
    build:
      context: ./apps/planner-ui
    container_name: trax-io-planner-ui
    ports:
      - "8088:80" # host 8080 is taken by the eMRO system
    depends_on:
      bff:
        condition: service_healthy

  # New Trax Inventory Optimizer web UI (apps/web) — the spec-faithful React/Tailwind/shadcn app.
  # Same-origin: nginx proxies /v1 -> bff. Runs alongside the legacy planner-ui.
  web:
    build:
      context: ./apps/web
    container_name: trax-io-web
    ports:
      - "8089:80" # 8088 is planner-ui, 8090/8091 are the eMRO/mxpp apps
    depends_on:
      bff:
        condition: service_healthy
