# Trax IO Review — local full-stack test deployment (Planner UI + BFF).
# Scoped to this project only. Does NOT touch any other containers.
#   docker compose up --build         # build + run
#   open http://localhost:8088         # the Planner UI (8080 is eMRO)
#   docker compose down                # stop + remove
name: trax-io-planner

services:
  bff:
    build:
      context: .
      dockerfile: deploy/bff.Dockerfile
    container_name: trax-io-bff
    # Seed from a REAL eMRO extract (network-pooled) instead of the baked 3-part sample.
    # The extract dir is a gitignored local copy (real data is not committed); mounted read-only.
    # To fall back to the sample, comment out the volume + EXTRACT_DIR/PLANNER_POOL_BY_PART envs.
    volumes:
      - ./deploy/_local_extract/emro_yyz:/data/extract:ro
    environment:
      - EXTRACT_DIR=/data/extract
      - PLANNER_POOL_BY_PART=1
      - PLANNER_NOW=2024-04-01T00:00:00+00:00
      - PLANNER_TENANT=acme
      - PLANNER_PROJECTOR=statistical # #5 StatisticalProjector (Croston/SBA/TSB) for intermittent demand
    ports:
      - "8001:8000" # direct API access for poking/debugging (optional; host 8000 was taken)
    healthcheck:
      test:
        [
          "CMD",
          "uv",
          "run",
          "--no-sync",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/tenants/acme/killswitch')",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s # seeding runs the reco at boot; statistical projector cold-compiles numba

  ui:
    build:
      context: ./apps/planner-ui
    container_name: trax-io-planner-ui
    ports:
      - "8088:80" # host 8080 is taken by the eMRO system
    depends_on:
      bff:
        condition: service_healthy
