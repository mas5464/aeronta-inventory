# Trax IO Review — local full-stack test deployment (Planner UI + BFF).
# Scoped to this project only. Does NOT touch any other containers.
#   docker compose up --build         # build + run
#   open http://localhost:8088         # the Planner UI (8080 is eMRO)
#   docker compose down                # stop + remove
name: trax-io-planner

services:
  bff:
    build:
      context: .
      dockerfile: deploy/bff.Dockerfile
    container_name: trax-io-bff
    # Seed from a REAL network-wide eMRO extract (~22.9K planning-active keys), network-pooled.
    # Recommendations are PRECOMPUTED offline (trax-io-precompute) into recs.json and loaded via
    # from_snapshot at boot — the engine does NOT run at container start. Both are gitignored local
    # copies (real data not committed), mounted read-only. To revert to the live-reco path, drop
    # PLANNER_RECS_FILE (asgi falls back to from_extract); to use the sample, drop the volumes/envs.
    volumes:
      - ./deploy/_local_extract/emro_net:/data/extract:ro
      - ./deploy/_local_extract/emro_net_recs.json:/data/recs.json:ro
    environment:
      - EXTRACT_DIR=/data/extract
      - PLANNER_RECS_FILE=/data/recs.json # precomputed queue -> from_snapshot (no reco at boot)
      - PLANNER_POOL_BY_PART=1
      - PLANNER_NOW=2024-04-01T00:00:00+00:00
      - PLANNER_TENANT=acme
    ports:
      - "8001:8000" # direct API access for poking/debugging (optional; host 8000 was taken)
    healthcheck:
      test:
        [
          "CMD",
          "uv",
          "run",
          "--no-sync",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/tenants/acme/killswitch')",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 240s # from_snapshot skips the reco, but still rebuilds the feature store from a
      # ~282MB extract at boot (~190s: parse + pool 359K demand rows into 22.9K keys). Persisting the
      # pooled feature store is a follow-up to make boot truly fast.

  ui:
    build:
      context: ./apps/planner-ui
    container_name: trax-io-planner-ui
    ports:
      - "8088:80" # host 8080 is taken by the eMRO system
    depends_on:
      bff:
        condition: service_healthy

  # New Trax Inventory Optimizer web UI (apps/web) — the spec-faithful React/Tailwind/shadcn app.
  # Same-origin: nginx proxies /v1 -> bff. Runs alongside the legacy planner-ui.
  web:
    build:
      context: ./apps/web
    container_name: trax-io-web
    ports:
      - "8089:80" # 8088 is planner-ui, 8090/8091 are the eMRO/mxpp apps
    depends_on:
      bff:
        condition: service_healthy
