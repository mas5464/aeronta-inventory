# Trax IO — local full-stack test deployment (web UI + BFF).
# Scoped to this project only. Does NOT touch any other containers.
#   docker compose up --build         # build + run
#   open http://localhost:8089         # the Trax Inventory Optimizer web UI
#   docker compose down                # stop + remove
name: trax-io-planner

services:
  bff:
    build:
      context: .
      dockerfile: deploy/bff.Dockerfile
    container_name: trax-io-bff
    # For local dev: use extract_sample instead of precomputed snapshot.
    # PLANNER_SNAPSHOT_DIR would require the gitignored emro_net_full_snapshot precomputed data.
    # EXTRACT_DIR boots from extract CSVs (slower but works with just source control).
    # To use the fast snapshot mode: set PLANNER_SNAPSHOT_DIR=/data/snapshot and mount the precomputed directory.
    volumes:
      - ./services/recommendation-engine/examples/extract_sample:/data/extract:ro
    environment:
      - EXTRACT_DIR=/data/extract
      - PLANNER_TENANT=acme
    ports:
      - "8001:8000" # direct API access for poking/debugging (optional; host 8000 was taken)
    healthcheck:
      test:
        [
          "CMD",
          "uv",
          "run",
          "--no-sync",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/tenants/acme/killswitch')",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s # from_snapshot_dir loads the precomputed feature store — measured ~7s boot (was ~190s)

  # Trax Inventory Optimizer web UI (apps/web) — the spec-faithful React/Tailwind/shadcn app.
  # Same-origin: nginx proxies /v1 -> bff.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: trax-io-web
    ports:
      - "8089:80" # 8090/8091 are the eMRO/mxpp apps
    depends_on:
      bff:
        condition: service_healthy
