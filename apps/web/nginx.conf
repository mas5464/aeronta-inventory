server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy the BFF API to the bff service (same compose network) — keeps the UI same-origin.
    location /v1/ {
        proxy_pass http://bff:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: hash routing means all UI routes resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
