<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Aeronta Inventory</title>
    <script>
      // Pre-paint theme: :root is light by default (Aeronta parent brand), so
      // only a stored "dark" preference needs applying here (before the bundle
      // loads) to avoid a light→dark flash for returning dark-mode users. See
      // src/lib/useTheme.ts.
      (function () {
        try {
          if (localStorage.getItem("trax-web-theme") === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {
          /* localStorage unavailable — fall back to the light default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
