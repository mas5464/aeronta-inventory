[project]
name = "observability-soc2"
version = "0.1.0"
description = "Trax IO Observability + SOC 2 Control Plane CDK app (Phase 1 scaffold, synth-only)"
requires-python = ">=3.11"
readme = "README.md"
authors = [
    { name = "Trax IO Platform + SecOps" },
]
dependencies = [
    "aws-cdk-lib>=2.147.0",
    "constructs>=10.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["observability_soc2"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
