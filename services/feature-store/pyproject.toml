[project]
name = "trax-io-feature-store"
version = "0.1.0"
description = "Trax IO Feature Store read client (Protocol + in-memory stub per ADR-0002)."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.4.0",
  # PySpark is provided by Glue at runtime; needed only for local unit tests.
  # Requires a JDK in the local env. Tests that need Spark skip cleanly when
  # it or its runtime deps aren't available.
  "pyspark>=3.5.0",
  # In-memory DynamoDB mock for the online-layer tests (no Docker/AWS).
  "moto[dynamodb]>=5.0.0",
]
# Production read client (GlueIcebergFeatureStore). pyiceberg is pure-Python (no JVM):
# `sql-sqlite` provides the local catalog used by tests; production injects a GlueCatalog.
iceberg = [
  "pyiceberg[sql-sqlite]>=0.7.0",
  "pyarrow>=15.0.0",
]
# Online-feature layer (DynamoDbOnlineStore) — the low-latency event-triggered read path.
dynamodb = [
  "boto3>=1.34.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trax_io_feature_store"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# AWS Glue 4.0's managed execution contract. Keep this separate from the
# developer interpreter/dependency set: local tests may run on a newer Python
# and Spark, while the deployed job sources must remain valid for this exact
# production runtime.
[tool.trax-io.glue-runtime]
aws-glue = "4.0"
python = "3.10"
pyspark = "3.3.0"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Glue 4.0 runs Python 3.10; datetime.UTC is Python 3.11+.
"src/trax_io_feature_store/glue/*.py" = ["UP017"]
"src/trax_io_feature_store/online_store.py" = ["UP017"]
