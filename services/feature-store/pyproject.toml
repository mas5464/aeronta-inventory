[project]
name = "trax-io-feature-store"
version = "0.1.0"
description = "Trax IO Feature Store read client (Protocol + in-memory stub per ADR-0002)."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.4.0",
  # PySpark is provided by Glue at runtime; needed only for local unit tests.
  # Requires a JDK in the local env. Tests that need Spark skip cleanly when
  # it or its runtime deps aren't available.
  "pyspark>=3.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trax_io_feature_store"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
