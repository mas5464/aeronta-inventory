[project]
name = "trax-io-agent-spine"
version = "0.1.0"
description = "Trax IO Agent Spine — deterministic orchestration core (Supervisor + guardrail + writeback)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "trax-io-feature-store",
    "trax-io-reco",
    "trax-io-event-publisher",
    "trax-io-forecasting",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "ruff>=0.4.0"]
emro = ["fastapi>=0.111.0"]
bff = ["fastapi>=0.115"]
cedar = ["cedarpy>=4.0"]

[project.scripts]
trax-io-spine = "trax_io_spine.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
trax-io-feature-store = { path = "../feature-store" }
trax-io-reco = { path = "../recommendation-engine" }
trax-io-event-publisher = { path = "../event-publisher" }
trax-io-forecasting = { path = "../forecasting" }

[tool.hatch.build.targets.wheel]
packages = ["src/trax_io_spine"]

[tool.hatch.build.targets.wheel.force-include]
"src/trax_io_spine/guardrail/policies/autonomy_bands.cedar" = "trax_io_spine/guardrail/policies/autonomy_bands.cedar"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
