# ---- HTTP ----
quarkus.http.port=8080

# ---- Datasource: production values come from env; tests/dev use Dev Services ----
# The URL/credentials are %prod-scoped: defining them (even as empty ${VAR:} expansions)
# in the default profile marks the URL as "configured", which suppresses Dev Services
# at build time and leaves the datasource deactivated in tests.
quarkus.datasource.db-kind=oracle
%prod.quarkus.datasource.username=${WRITEBACK_DB_USER:writeback}
%prod.quarkus.datasource.password=${WRITEBACK_DB_PASSWORD:}
%prod.quarkus.datasource.jdbc.url=${WRITEBACK_DB_URL:}
quarkus.datasource.devservices.image-name=gvenzl/oracle-free:23-slim-faststart

# ---- Hibernate ----
quarkus.hibernate-orm.database.generation=none
%test.quarkus.hibernate-orm.database.generation=drop-and-create

# ---- Flyway: manages ONLY the service-owned WRITEBACK_LEDGER ----
quarkus.flyway.migrate-at-start=true
%test.quarkus.flyway.migrate-at-start=false

# ---- JWT (production issuer/keys via env; tests use quarkus-test-security-jwt) ----
mp.jwt.verify.publickey.location=${WRITEBACK_JWT_PUBLICKEY_LOCATION:}
%test.mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=${WRITEBACK_JWT_ISSUER:https://dev.local/issuer}

# ---- Kafka channels (Dev Services provides broker in tests/dev) ----
mp.messaging.incoming.writeback-in.connector=smallrye-kafka
mp.messaging.incoming.writeback-in.topic=optimizer.writeback.v1
mp.messaging.incoming.writeback-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.writeback-in.auto.offset.reset=earliest
mp.messaging.outgoing.writeback-results.connector=smallrye-kafka
mp.messaging.outgoing.writeback-results.topic=optimizer.writeback.results.v1
mp.messaging.outgoing.writeback-results.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.writeback-dlq.connector=smallrye-kafka
mp.messaging.outgoing.writeback-dlq.topic=optimizer.writeback.dlq.v1
mp.messaging.outgoing.writeback-dlq.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# ---- Observability ----
quarkus.micrometer.export.prometheus.enabled=true
# JSON console logging arrives with the observability task (quarkus-logging-json extension)
