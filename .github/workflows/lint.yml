name: Lint

on:
  push:
    branches: [ main, claude/* ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Lint Python (Ruff)
        run: |
          pip install uv
          uv run ruff check .
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: TypeScript & ESLint (apps/web)
        run: |
          cd apps/web
          npm install
          npm run lint
