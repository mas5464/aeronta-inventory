[project]
name = "trax-io-extract"
version = "0.1.0"
description = "Trax IO nightly Oracle extract utility (Phase 1 scaffold)"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.0",
    "oracledb>=2.2.0",
    "pydantic>=2.6.0",
    "python-dateutil>=2.9.0",
    "python-ulid>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.4.0",
]
# boto3 is only needed to land to S3 (the --landing s3://... path); the S3Sink itself
# takes an injected client, so the logic is testable without it.
s3 = [
    "boto3>=1.34.0",
]

[project.scripts]
trax-io-extract = "trax_io_extract.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trax_io_extract"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
# src on path so tests import the package regardless of editable-install state
# (uv's editable .pth is unreliable with a space in the repo path; see .claude/memory/lessons.md).
pythonpath = ["src"]
