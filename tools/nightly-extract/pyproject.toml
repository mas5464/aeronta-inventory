[project]
name = "trax-io-extract"
version = "0.1.0"
description = "Trax IO nightly Oracle extract utility (Phase 1 scaffold)"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.0",
    "oracledb>=2.2.0",
    "pydantic>=2.6.0",
    "python-dateutil>=2.9.0",
    "python-ulid>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.4.0",
]

[project.scripts]
trax-io-extract = "trax_io_extract.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trax_io_extract"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
